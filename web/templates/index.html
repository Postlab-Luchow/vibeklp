<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
    <title>Kulturelle Landpartie 2026</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- App stylesheet (generated by `make css`) -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="bg-canvas text-ink min-h-screen">

    <!-- ===== Header ===== -->
    <header class="sticky top-0 z-50 h-14 bg-surface/95 backdrop-blur border-b border-border">
        <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between gap-4">
            <a class="flex items-center gap-2 min-w-0" href="/">
                <i class="fas fa-palette text-accent text-base shrink-0"></i>
                <span class="font-semibold tracking-tight text-[15px] sm:text-base truncate">
                    Kulturelle Landpartie <span class="text-muted font-normal">2026</span>
                </span>
            </a>
            <nav class="flex items-center gap-1">
                <button class="nav-btn group inline-flex items-center gap-2 px-3 h-9 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface-elevated transition" data-view="map">
                    <i class="fas fa-map text-[13px]"></i>
                    <span class="hidden sm:inline">Karte</span>
                </button>
                <button class="nav-btn group inline-flex items-center gap-2 px-3 h-9 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface-elevated transition" data-view="calendar">
                    <i class="fas fa-calendar text-[13px]"></i>
                    <span class="hidden sm:inline">Kalender</span>
                </button>
                <button class="nav-btn group inline-flex items-center gap-2 px-3 h-9 rounded-lg text-sm text-muted hover:text-ink hover:bg-surface-elevated transition" data-view="favorites">
                    <i class="fas fa-heart text-[13px]"></i>
                    <span class="hidden sm:inline">Favoriten</span>
                    <span class="badge inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full bg-accent/15 text-accent text-[11px] font-semibold" id="favorites-count">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- ===== Toast / error banner ===== -->
    <div id="error-container" class="fixed top-16 left-0 right-0 z-[1500] max-w-2xl mx-auto px-4 empty:hidden flex flex-col gap-2"></div>

    <!-- ===== Main ===== -->
    <main class="max-w-7xl mx-auto flex h-[calc(100vh-3.5rem)] relative">
        <!-- Mobile bottom-sheet backdrop -->
        <div id="sidebar-backdrop" class="hidden"></div>

        <!-- ===== Sidebar ===== -->
        <aside id="sidebar" class="sidebar w-[360px] shrink-0 bg-surface border-r border-border overflow-y-auto scrollbar-thin">
            <button id="sidebar-close" class="sidebar-close hidden" aria-label="Filter schließen">
                <i class="fas fa-times"></i>
            </button>

            <div class="px-6 lg:px-8 py-6 space-y-7">

                <!-- Search -->
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-muted text-sm pointer-events-none"></i>
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Orte, Künstler, Events …"
                        class="w-full h-10 pl-9 pr-3 rounded-lg bg-surface-elevated border border-transparent focus:border-accent focus:bg-surface focus:outline-none text-sm placeholder:text-muted transition"
                    />
                    <button id="search-btn" class="sr-only" aria-label="Suchen">Suchen</button>
                </div>

                <!-- Filters -->
                <section class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-[11px] uppercase tracking-[0.12em] font-semibold text-muted">Filter</h3>
                        <button id="reset-filters" class="text-xs text-muted hover:text-accent transition">
                            Zurücksetzen
                        </button>
                    </div>

                    <div class="space-y-3">
                        <label class="block">
                            <span class="block text-xs text-muted mb-1">Datum</span>
                            <select id="date-filter" class="w-full h-9 px-3 rounded-lg border border-border bg-surface hover:border-border-strong focus:border-accent focus:outline-none text-sm transition">
                                <option value="">Alle Tage</option>
                            </select>
                        </label>

                        <label class="block">
                            <span class="block text-xs text-muted mb-1">Tageszeit</span>
                            <select id="time-filter" class="w-full h-9 px-3 rounded-lg border border-border bg-surface hover:border-border-strong focus:border-accent focus:outline-none text-sm transition">
                                <option value="">Ganzer Tag</option>
                                <option value="morning">Vormittag (bis 13 Uhr)</option>
                                <option value="afternoon">Nachmittag (13–17 Uhr)</option>
                                <option value="evening">Abend (17–21 Uhr)</option>
                                <option value="late">Spät (ab 21 Uhr)</option>
                            </select>
                        </label>

                        <label class="block">
                            <span class="block text-xs text-muted mb-1">Kategorie</span>
                            <select id="event-category-filter" class="w-full h-9 px-3 rounded-lg border border-border bg-surface hover:border-border-strong focus:border-accent focus:outline-none text-sm transition">
                                <option value="">Alle Kategorien</option>
                            </select>
                        </label>

                        <label class="block">
                            <span class="block text-xs text-muted mb-1">Angebote vor Ort</span>
                            <select id="category-filter" class="w-full h-9 px-3 rounded-lg border border-border bg-surface hover:border-border-strong focus:border-accent focus:outline-none text-sm transition">
                                <option value="">Alle Angebote</option>
                            </select>
                        </label>

                        <label class="flex items-center gap-2 pt-1 cursor-pointer select-none">
                            <input type="checkbox" id="bike-route-filter" class="h-4 w-4 rounded border-border-strong accent-accent" />
                            <span class="text-sm">Nur mit Fahrradroute</span>
                        </label>
                    </div>
                </section>

                <!-- Results -->
                <section>
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="text-[11px] uppercase tracking-[0.12em] font-semibold text-muted">
                            <span id="results-count">0</span> Orte
                        </h3>
                    </div>
                    <div id="results-list" class="divide-y divide-border -mx-6 lg:-mx-8"></div>
                </section>
            </div>
        </aside>

        <!-- ===== Content ===== -->
        <div class="content flex-1 relative overflow-hidden">
            <!-- Map view -->
            <div id="map-view" class="view active absolute inset-0">
                <div id="map" class="w-full h-full"></div>

                <!-- Map controls -->
                <div class="map-controls absolute top-4 right-4 z-[500] flex flex-col gap-2">
                    <button id="locate-btn" class="map-control-btn w-10 h-10 inline-flex items-center justify-center rounded-lg bg-surface text-accent shadow-soft hover:bg-accent hover:text-white transition" title="Meine Position">
                        <i class="fas fa-location-crosshairs"></i>
                    </button>
                    <button id="route-btn" class="map-control-btn w-10 h-10 inline-flex items-center justify-center rounded-lg bg-surface text-accent shadow-soft hover:bg-accent hover:text-white transition" title="Routenplanung">
                        <i class="fas fa-route"></i>
                    </button>
                </div>
            </div>

            <!-- Calendar view -->
            <div id="calendar-view" class="view absolute inset-0 overflow-y-auto scrollbar-thin">
                <div id="calendar" class="px-6 sm:px-10 py-8 max-w-4xl mx-auto"></div>
            </div>

            <!-- Favorites view -->
            <div id="favorites-view" class="view absolute inset-0 overflow-y-auto scrollbar-thin">
                <div id="favorites-list" class="px-6 sm:px-10 py-8 max-w-4xl mx-auto"></div>
            </div>
        </div>

        <!-- Mobile filter floating button -->
        <button id="mobile-filter-toggle" class="mobile-filter-toggle hidden" aria-label="Filter öffnen">
            <i class="fas fa-sliders-h"></i>
            <span>Filter</span>
        </button>
    </main>

    <!-- ===== Detail Modal ===== -->
    <!-- Layout: modal-content is a fixed-height flex column with overflow-hidden so the
         close button stays anchored to its corner; the internal detail-content does the
         scrolling. This keeps the X reachable even on long venue modals. -->
    <div id="detail-modal" class="modal fixed inset-0 z-[2000] items-center justify-center bg-black/50 p-4 sm:p-6">
        <div class="modal-content relative w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden bg-surface text-ink rounded-2xl shadow-elevated">
            <button class="modal-close absolute top-3 right-3 z-10 w-9 h-9 inline-flex items-center justify-center rounded-full bg-surface-elevated hover:bg-accent hover:text-white text-muted transition" aria-label="Schließen">
                <i class="fas fa-times"></i>
            </button>
            <div id="detail-content" class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-6 sm:px-8 py-8"></div>
        </div>
    </div>

    <!-- ===== Loading spinner ===== -->
    <div id="loading" class="loading fixed inset-0 z-[3000] flex-col items-center justify-center gap-4 bg-canvas/90 backdrop-blur-sm">
        <div class="spinner"></div>
        <p class="text-sm text-muted">Lade Daten …</p>
    </div>

    <!-- Mobile bottom-sheet styles (depend on body.sidebar-open so they live here, not in tailwind-input.css) -->
    <style>
        /* show/hide toggles — JS uses `.active` on these wrapper elements */
        .view { display: none; }
        .view.active { display: block; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .loading { display: none; }
        .loading.active { display: flex; }

        /* nav button active state (current view) */
        .nav-btn.active {
            background: rgb(var(--accent-soft));
            color: rgb(var(--accent));
        }
        .nav-btn.active .badge {
            background: rgb(var(--accent));
            color: white;
        }

        /* favorite (heart) toggle and other btn-icon active state */
        .btn-icon.active {
            background: rgb(var(--accent));
            color: white;
            border-color: rgb(var(--accent));
        }

        /* routing button while route mode is on (toggled by routing.js) */
        #route-btn.active {
            background: rgb(var(--accent));
            color: white;
        }

        @media (max-width: 768px) {
            main { flex-direction: column; height: calc(100vh - 3.5rem); }
            .content { width: 100%; height: 100%; }

            .sidebar {
                position: fixed;
                left: 0; right: 0; bottom: 0;
                width: 100%;
                max-height: 80vh;
                height: auto;
                border-right: 0;
                border-top: 1px solid rgb(var(--border));
                border-radius: 1.25rem 1.25rem 0 0;
                box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.22);
                transform: translateY(100%);
                transition: transform 0.28s ease-out;
                z-index: 1500;
            }
            body.sidebar-open .sidebar { transform: translateY(0); }

            .sidebar-close {
                display: flex !important;
                position: sticky;
                top: 0.5rem;
                margin: 0.5rem 0.5rem 0 auto;
                width: 32px;
                height: 32px;
                align-items: center;
                justify-content: center;
                border-radius: 9999px;
                border: 0;
                background: rgb(var(--surface-elevated));
                color: rgb(var(--ink));
                cursor: pointer;
                z-index: 1;
            }

            #sidebar-backdrop {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1450;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.22s;
            }
            body.sidebar-open #sidebar-backdrop {
                opacity: 1;
                pointer-events: auto;
            }

            .mobile-filter-toggle {
                display: inline-flex !important;
                position: fixed;
                bottom: 1rem;
                right: 1rem;
                z-index: 1400;
                background: rgb(var(--accent));
                color: white;
                border: 0;
                border-radius: 9999px;
                padding: 0.65rem 1.1rem;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
                align-items: center;
                gap: 0.5rem;
                font-size: 0.9rem;
                font-weight: 500;
                cursor: pointer;
            }
            body.sidebar-open .mobile-filter-toggle { display: none !important; }
        }
    </style>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- App -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/map.js"></script>
    <script src="/static/js/calendar.js"></script>
    <script src="/static/js/filters.js"></script>
    <script src="/static/js/favorites.js"></script>
    <script src="/static/js/routing.js"></script>
</body>
</html>
